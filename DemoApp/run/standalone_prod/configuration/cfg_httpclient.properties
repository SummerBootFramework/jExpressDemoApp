##############################
# 2. HTTP Client Performance #
##############################

# Note: The maximum time to wait for only the connection to be established, should be less than http.timeout.ms
#connection.timeout.ms=3000

# Note: The maximum time to wait from the beginning of the connection establishment until the server sends data back, this is the end-to-end timeout.
#request.timeout.ms=5000

# Note: The maximum number of TCP connections per domain determines the "concurrency output limit" under high concurrency: For HTTP/1.1 set to 2000 connections per domain, while HTTP/2 sets to 500 TCP connections per domain.
#jdk.httpclient.maxconnections=2000

# Note: The total number of connections in the connection pool, ensuring sufficient space for idle connections (slightly larger than the single-domain limit to allow for occasional minor adjustments), determines the "connection retention and reuse capability" after a request ends.
#jdk.httpclient.connectionPoolSize=2500

# Note: Extending the lifespan of long-lived connections: Since it's a high-frequency access, keeping connections alive for 120 seconds allows newly arriving virtual threads to 100% utilize existing connections. For HTTP/1.1 shortens this to 60 seconds (to avoid long-term port saturation due to too many connections), while HTTP/2 keeps connections alive for 120 seconds to maximize connection reuse.
#jdk.httpclient.keepalive.timeout=120

# Note: enable/disable the responseCallback.executor, default is false for quick and small response body, enable it when response is slow and large, and the responseCallback is CPU bound
#responseCallback.executor.enabled=false

# Note: valid value = VirtualThread (default), CPU, IO and Mixed 
# Note:  use CPU core + 1 when application is CPU bound
# Note: use CPU core x 2 + 1 when application is I/O bound
# Note: need to find the best value based on your performance test result when nio.server.BizExecutor.mode=Mixed
#responseCallback.executor.mode=VirtualThread

# Note: CoreSize 0 = Integer.MAX_VALUE
#responseCallback.executor.CoreSize=2147483647

# Note: MaxSize 0 = Integer.MAX_VALUE
#responseCallback.executor.MaxSize=2147483647

# Note: The waiting list size when the pool is full
#responseCallback.executor.QueueSize=2147483647
#responseCallback.executor.KeepAliveSec=60
#responseCallback.executor.prestartAllCoreThreads=false
#responseCallback.executor.allowCoreThreadTimeOut=false


