##############################
# 2. HTTP Client Performance #
##############################
# Note: The time-to-live for DNS cache entries, default is 30 seconds, min is -1.
#networkaddress.cache.ttl=

# Note: The time-to-live for negative DNS cache entries, default is 10 seconds, min is -1.
#networkaddress.cache.negative.ttl=

# Note: Control the lifetime of idle connections in the HTTP/1.1 connection pool, default 30 seconds since JDK 20+
#jdk.httpclient.keepalive.timeout=

# Note: Control the lifetime of idle connections in the HTTP/2 connection pool, default 30 seconds since JDK 20+
#jdk.httpclient.keepalive.timeout.h2=

# Note: The maximum time to wait for only the connection to be established, should be less than http.timeout.ms
#HttpClient.connection.timeout.ms=3000

# Note: The maximum time to wait from the beginning of the connection establishment until the server sends data back, this is the end-to-end timeout.
#HttpClient.request.timeout.ms=5000

# Note: The maximum number of concurrent requests, no limit by default. Blank or 0 or Integer.MAX_VALUE means no limit. If the number of concurrent requests exceeds this limit, the request will be hold to wait for next available slot. This is to prevent the server from being overwhelmed by too many requests.
#HttpClient.request.limiter.max.concurrent=

# Note: The maximum time to wait for a concurrent request slot, default is 3000 ms, no timeout if the value is 0 or blank or Long.MAX_VALUE. If the request cannot get a slot within this time, it will be rejected with an error.
#HttpClient.request.limiter.queuing.timeout.ms=3000

# Note: Idle timeout threshold in seconds before triggering an idle event (HttpRpcClient.onIdle(IdleEventMonitor idleEventMonitor)) when no outgoing HTTP requests are sent.
#HttpClient.request.idleEventMonitor.threshold.second=60
#HttpClient.request.idleEventMonitor.name=HttpClient

# Note: enable/disable the responseCallback.executor, default is false for quick and small response body, enable it when response is slow and large, and the responseCallback is CPU bound
#HttpClient.responseCallback.executor.enabled=false

# Note: valid value = VirtualThread (default), CPU, IO and Mixed 
# Note:  use CPU core + 1 when application is CPU bound
# Note: use CPU core x 2 + 1 when application is I/O bound
# Note: need to find the best value based on your performance test result when nio.server.BizExecutor.mode=Mixed
#responseCallback.executor.mode=VirtualThread

# Note: CoreSize 0 = Integer.MAX_VALUE
#HttpClient.responseCallback.executor.CoreSize=2147483647

# Note: MaxSize 0 = Integer.MAX_VALUE
#HttpClient.responseCallback.executor.MaxSize=2147483647

# Note: The waiting list size when the pool is full
#HttpClient.responseCallback.executor.QueueSize=2147483647
#HttpClient.responseCallback.executor.KeepAliveSec=60
#HttpClient.responseCallback.executor.prestartAllCoreThreads=false
#HttpClient.responseCallback.executor.allowCoreThreadTimeOut=false


##########################################################################################
# 3. HTTP Client Default Headers                                                         #
# put generic HTTP Client request headers here                                           #
# [Format] HttpClient.DefaultRequestHeaders.<request_header_name>=<request_header_value> #
# [Example] HttpClient.DefaultRequestHeaders.Accept=application/json                     #
# [Example] HttpClient.DefaultRequestHeaders.Content-Type=application/json;charset=UTF-8 #
# [Example] HttpClient.DefaultRequestHeaders.Accept-Language=en-ca                       #
##########################################################################################
HttpClient.DefaultRequestHeaders.Accept=application/json
HttpClient.DefaultRequestHeaders.Content-Type=application/json;charset=UTF-8


