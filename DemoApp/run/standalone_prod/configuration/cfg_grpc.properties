########################################################################################
# 4. gRpc.server ServerBuilder Settings                                                #
# The following settings are for ServerBuilder, which is used to config a gRPC channel #
########################################################################################
# Note: Enforcement Policy: default 300 (5 minutes) if not set. The minimum allowed interval for a client to send keepalive PINGs. If a client sets its keepAliveTime to less than 5 minutes, the server will flag it as a Ping Flood (attack) and forcefully drop the connection by sending a GOAWAY frame with the error code ENHANCE_YOUR_CALM
#gRpc.server.channel.permitKeepAliveTimeSeconds=

# Note: Enforcement Policy: default (not allowed) false if not set. Determines whether a client is allowed to send keepalive PINGs when there are no active RPC requests on the TCP connection. Since it defaults to false, if a client sends keepalive heartbeats during a completely idle period, the server will penalize it by tearing down the connection.
#gRpc.server.channel.permitKeepAliveWithoutCalls=

# Note: Server Keepalive: default 7200 (2 hours) if not set. The idle duration after which the server will actively send an HTTP/2 PING frame to the client if no traffic has been read from the connection for a full 2 hours. This is used to verify whether the client is still alive
#gRpc.server.channel.keepAliveTimeSeconds=

# Note: Server Keepalive: default 20 if not set. The maximum time the server waits for a client to reply with an ACK after sending a heartbeat PING. If no response is received within 20 seconds, the server assumes the client is unreachable due to network failure and terminates the TCP connection.
#gRpc.server.channel.keepAliveTimeoutSeconds=

# Note: Connection Management: default 120 (2 minutes) if not set. The maximum allowed duration for TLS handshakes and HTTP/2 protocol negotiation when a new TCP connection is established. If the handshake blocks or lags beyond 2 minutes, the server will forcefully terminate the new connection.
#gRpc.server.channel.handshakeTimeoutSeconds=

# Note: Connection Management: default Long.MAX_VALUE nanoseconds (292 years) if not set. The maximum duration a connection is allowed to remain alive after the number of active RPCs drops to 0 (when the connection becomes idle). An infinite default means the server will never proactively kill a connection just because it is idle.
#gRpc.server.channel.maxConnectionIdleSeconds=

# Note: Connection Management: default Long.MAX_VALUE nanoseconds (292 years) if not set. The absolute maximum lifespan (age) allowed for a TCP connection. If configured (e.g., to 30 minutes), the server will gracefully close the connection via GOAWAY once that time expires—regardless of how much business traffic is flowing—forcing the client to reconnect and trigger fresh load balancing at the F5 level.
#gRpc.server.channel.maxConnectionAgeSeconds=

# Note: Connection Management: default Long.MAX_VALUE nanoseconds (292 years) if not set. Works in tandem with maxConnectionAge. When a connection reaches its age limit and the server sends a GOAWAY, this parameter defines the grace period during which remaining active RPCs are allowed to finish. Once this buffer time expires, any uncompleted requests are forcefully terminated.
#gRpc.server.channel.maxConnectionAgeGraceSeconds=

# Note: Size Protection: default 4,194,304 Bytes (4MB) if not set. The maximum payload size of a single gRPC message that the server is permitted to receive. This acts as a safeguard to prevent malicious or accidental oversized payloads from causing Out-Of-Memory (OOM) errors in the server's JVM.
#gRpc.server.channel.maxInboundMessageBytes=

# Note: Size Protection: default 8,192 Bytes (8KB) if not set. The maximum cumulative size allowed for HTTP/2 headers (gRPC Metadata) (corresponds to the HTTP/2 SETTINGS_MAX_HEADER_LIST_SIZE restriction). If a client attaches massive authorization tokens or highly complex metadata exceeding 8 KiB, the server will reject the request.
#gRpc.server.channel.maxInboundMetadataBytes=


######################################
# 5. gRpc.server health check policy #
######################################
# Note: This configuration can be overridden at code level by gRPC BindableService methods with @RequiresHealthCheck annotation: 
# Note: Leave blank or comment out (default, and accept request even if any @HealthCheck fails), 
# Note: or REQUIRE_ALL (if any class annotated with @HealthCheck fails the check, the request is rejected and a 9 FAILED_PRECONDITION error is returned), 
# Note: or a list of @HealthCheck.name in CSV format (if any listed @HealthCheck fails the check, the request is rejected and a 9 FAILED_PRECONDITION error is returned)
# [Format] Leave blank or comment out | REQUIRE_ALL | @HealthCheck.name1, @HealthCheck.name2, ..., @HealthCheck.nameN
#gRpc.server.defaultRequiredHealthChecks=
